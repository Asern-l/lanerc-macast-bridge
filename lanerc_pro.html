<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Lanerc Cast</title>
  <link rel="icon" href="/assets/brand.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <img src="/assets/brand.svg" width="40" height="40" alt="">
        <div>
          <div class="brand-line"><h1>Lanerc Cast</h1><span id="app-version" class="version">2.3.0</span></div>
          <p>Macast 播放兼容与电视转码</p>
        </div>
      </div>
      <div id="service-state" class="service-state" role="status">
        <span class="status-dot"></span><span>正在连接</span>
      </div>
    </header>

    <main>
      <div id="warning-list" class="notice-stack" aria-live="polite"></div>

      <section class="section" aria-labelledby="output-heading">
        <div class="section-title">
          <div><span class="step">01</span><h2 id="output-heading">播放位置</h2></div>
          <p>选择 Lanerc 投屏到本机后，媒体最终在哪里播放。</p>
        </div>
        <div class="choice-grid" role="radiogroup" aria-label="播放位置">
          <button id="mode-local" class="choice" type="button" role="radio">
            <span class="choice-title">本机播放</span>
            <span class="choice-copy">使用 PotPlayer 或 Macast 内置播放器</span>
          </button>
          <button id="mode-tv" class="choice" type="button" role="radio">
            <span class="choice-title">电视播放</span>
            <span class="choice-copy">电脑兼容转码后发送到 DLNA 电视</span>
          </button>
        </div>
      </section>

      <section id="local-panel" class="section mode-panel" aria-labelledby="player-heading">
        <div class="section-title">
          <div><span class="step">02</span><h2 id="player-heading">本机播放器</h2></div>
          <p>优先选择已经安装且适合当前媒体的播放器。</p>
        </div>
        <div class="field-row">
          <div class="field-grow">
            <label for="player">默认播放器</label>
            <select id="player">
              <option value="potplayer">PotPlayer</option>
              <option value="mpv">Macast 内置播放器</option>
            </select>
          </div>
          <div id="player-state" class="inline-state"></div>
        </div>
        <div class="path-field">
          <label for="potplayer-path">PotPlayer 程序路径</label>
          <input id="potplayer-path" type="text" placeholder="留空则自动检测，例如 D:\PotPlayer\PotPlayerMini64.exe" spellcheck="false">
        </div>
      </section>

      <section id="tv-panel" class="section mode-panel" aria-labelledby="tv-heading" hidden>
        <div class="section-title section-title-action">
          <div>
            <div><span class="step">02</span><h2 id="tv-heading">目标电视</h2></div>
            <p>扫描同一局域网内支持 DLNA 的电视或播放设备。</p>
          </div>
          <button id="refresh" class="button secondary" type="button">重新扫描</button>
        </div>
        <div id="devices" class="device-list" aria-live="polite"></div>
        <p id="scan-meta" class="meta-line"></p>

        <div class="subsection">
          <h3>声音输出</h3>
          <div class="radio-list">
            <label class="radio-option">
              <input type="radio" name="tv-audio" value="tv">
              <span><strong>随电视输出</strong><small>推荐。电视负责画面与声音，同步最稳定。</small></span>
            </label>
            <label class="radio-option">
              <input type="radio" name="tv-audio" value="computer">
              <span><strong>从电脑输出</strong><small>实验性。适合连接电脑的蓝牙耳机，可能需要同步补偿。</small></span>
            </label>
          </div>
        </div>

        <div id="sync-panel" class="subsection sync-panel" hidden>
          <div class="sync-heading">
            <div><h3>音画同步补偿</h3><p>电视缓冲时间因型号和网络而异。</p></div>
            <span class="experimental">实验性</span>
          </div>
          <label class="switch-row" for="auto-sync">
            <span><strong>尝试读取电视播放进度</strong><small>电视不提供有效进度时，自动使用下方固定延迟。</small></span>
            <input id="auto-sync" type="checkbox" role="switch">
          </label>
          <div class="delay-control">
            <label for="audio-delay">电脑声音延迟</label>
            <output id="audio-delay-value" for="audio-delay">2.0 秒</output>
            <input id="audio-delay" type="range" min="0" max="8" step="0.5" value="2">
            <div class="range-labels"><span>0 秒</span><span>8 秒</span></div>
          </div>
        </div>
      </section>

      <details class="diagnostics">
        <summary>运行环境</summary>
        <dl>
          <div><dt>PotPlayer</dt><dd id="diag-potplayer">正在检测</dd></div>
          <div><dt>FFmpeg</dt><dd id="diag-ffmpeg">正在检测</dd></div>
          <div><dt>控制服务</dt><dd id="diag-service">正在检测</dd></div>
        </dl>
      </details>
    </main>

    <footer class="action-bar">
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div class="action-buttons">
        <button id="reset" class="button secondary" type="button">恢复已保存设置</button>
        <button id="save" class="button primary" type="button">保存并应用</button>
      </div>
    </footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
